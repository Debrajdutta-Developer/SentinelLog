[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinellog"
version = "0.1.0"
description = "Defensive authentication log monitoring and suspicious activity detection"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Debraj Dutta"}]
license = {text = "MIT"}

[project.scripts]
sentinellog = "sentinellog.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
